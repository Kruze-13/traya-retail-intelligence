name: Traya Weekly Retail Flash

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

jobs:
  run-retail-flash:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate weekly Traya flash
        env:
          LOCAL_DATA_PATH: data/traya_input.xlsx
          APP_API_KEY: test123
        run: |
          python -c "from app import app; c=app.test_client(); r=c.get('/report?cadence=weekly', headers={'X-API-Key':'test123'}); print('Status:', r.status_code); data=r.get_json(); print('Cadence:', data.get('cadence')); print('HTML generated:', len(data.get('html_body','')), 'characters'); print('Images generated:', list(data.get('images',{}).keys())); assert r.status_code == 200"