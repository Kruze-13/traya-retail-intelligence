name: Traya Weekly Retail Flash

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

jobs:
  run-retail-flash:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate weekly Traya flash
        env:
          LOCAL_DATA_PATH: data/traya_input.xlsx
        run: |
          python app.py